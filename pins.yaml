# The XZ Utils binary the interop tests hold the package to (interop_test.go):
# forkcloser/testbin's build of upstream's release, one archive per platform
# the tests run on, verified against testbin's release attestation (limen's
# book, tooling.md, "Pinned artifacts beyond aqua"). The `xz-utils` recipe
# fetches this host's and puts it on the tests' PATH as xz-utils. The archive
# name carries XZ Utils' own version, so a testbin release that moves to a
# newer XZ Utils changes it: Renovate's bump of `version:` then fails the
# digest refresh, and the five urls move by hand with it. The attestation is
# verified at the owner's scope: the pinned limen passes a `owner/repo`
# argument as `--owner`, which gh refuses, so the repository scope waits for
# a limen that passes it as `--repo`.
pins:
  - name: xz-utils-linux-amd64
    renovate: github-releases forkcloser/testbin
    version: 0.2.0
    url: https://github.com/forkcloser/testbin/releases/download/v${version}/xz-5.8.4-linux-amd64.tar.gz
    verify: github-attestation forkcloser
    digest:
      version: 0.2.0
      sha256: 5213fbe2f39b5f76ad6f20dd60960000e0a65047857a6919963f16b18e71c731
  - name: xz-utils-linux-arm64
    renovate: github-releases forkcloser/testbin
    version: 0.2.0
